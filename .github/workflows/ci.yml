name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rfc:
    name: Verify RFC
    uses: ./.github/workflows/rfc-verification.yml
    with:
      packages: '["./..."]'
      checklist-dirs: '["."]'
      fuzz-targets: >-
        [{"package":".","target":"FuzzParseRecord"},
         {"package":".","target":"FuzzExpandMacros"},
         {"package":".","target":"FuzzCheckHost"}]

  fixtures:
    name: Workflow fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.10"
          cache: true
      - run: python3 -m unittest discover -s .github/tests -v

  # Preserve the existing required context. Skipped/cancelled proof jobs must
  # never produce a successful Build & Test verdict.
  build:
    name: Build & Test
    needs: [rfc, fixtures]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification job to succeed
        env:
          RFC_RESULT: ${{ needs.rfc.result }}
          FIXTURE_RESULT: ${{ needs.fixtures.result }}
        run: test "$RFC_RESULT" = success && test "$FIXTURE_RESULT" = success
